
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiCi newsroom</title>
    <meta name="description" content="WiCi newsroom: what is new at WiCi, press coverage of WiCi One, and the media kit: product imagery, films, leadership bios, and logos.">
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="/media/newsroom">
    <link rel="preload" href="/css/fonts/test-financier-display-medium-italic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&display=swap">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="icon" type="image/png" href="/images/common/favicon.png">
    <link rel="apple-touch-icon" href="/images/common/apple-touch-icon.png">
    <script src="/js/tracking.js"></script>
    <style>
        /* Vertical padding only — .container owns the horizontal gutters. */
        /* Section menu, pinned under the site nav (64px; 56px on phones) */
        .mk-menu {
            position: sticky;
            top: 64px;
            z-index: 40;
            background: rgba(var(--bg-rgb), 0.86);
            -webkit-backdrop-filter: saturate(180%) blur(16px);
            backdrop-filter: saturate(180%) blur(16px);
            border-bottom: 1px solid var(--line);
        }
        .mk-menu-inner { display: flex; align-items: center; gap: 24px; height: 52px; }
        .mk-menu-title {
            font-size: var(--fs-lead);
            font-weight: 500;
            letter-spacing: var(--ls-title);
            color: var(--ink);
            text-decoration: none;
            white-space: nowrap;
            margin-right: auto;
        }
        .mk-menu-links { display: flex; gap: 6px; }
        .mk-menu-links a {
            padding: 6px 12px;
            border-radius: 999px; corner-shape: round;
            font-size: var(--fs-body-s);
            color: var(--ink-mute);
            text-decoration: none;
            white-space: nowrap;
            transition: color 0.2s var(--ease), background 0.2s var(--ease);
        }
        .mk-menu-links a:hover { color: var(--ink); }
        .mk-menu-sep { flex: 0 0 1px; height: 18px; margin: 0 8px; background: var(--line-strong); align-self: center; }
        .mk-menu-links a.is-current { color: var(--ink); background: var(--bg-tint); }

        /* The film is on white, so it sits straight on the page */
        .mk-hero-film { background: var(--bg-card); }
        .mk-hero-film video { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; }

        .mk-section { padding-top: 56px; padding-bottom: 64px; border-top: 1px solid var(--line); }
        .mk-section h2 {
            font-family: var(--font-display);
            font-size: var(--fs-h2-sub);
            font-weight: 500;
            line-height: var(--lh-title);
            letter-spacing: var(--ls-title);
            margin: 0 0 28px;
        }
        .mk-section .mk-lede {
            font-size: var(--fs-lead);
            color: var(--ink-mute);
            max-width: 640px;
            margin: -16px 0 28px;
        }

        /* Thumbnail grids — deliberately small tiles */
        .mk-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }
        .mk-tile { min-width: 0; }
        .mk-thumb {
            display: block;
            width: 100%;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--bg-card);
            cursor: zoom-in;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: border-color 0.2s var(--ease), transform 0.2s var(--ease);
        }
        .mk-thumb:hover, .mk-thumb:focus-visible { border-color: var(--line-strong); transform: translateY(-1px); }
        .mk-thumb img,
        .mk-thumb video {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: contain;
            background: #fff;
        }
        .mk-thumb--logo img { aspect-ratio: 5 / 3; padding: 16px; box-sizing: border-box; }
        .mk-thumb--photo img { aspect-ratio: 1 / 1; object-fit: cover; }
        .mk-cap {
            font-size: var(--fs-caption);
            color: var(--ink-mute);
            margin: 7px 2px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .mk-cap b { font-weight: 600; color: var(--ink-soft); }
        .mk-cap a { color: var(--accent-bright); text-decoration: none; }
        .mk-cap a:hover, .mk-cap a:focus-visible { text-decoration: underline; }
        .mk-cap--role { margin-top: 1px; white-space: normal; }
        .mk-logo-links { display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 4px 2px 0; font-size: var(--fs-caption); }
        .mk-logo-links a { display: inline-flex; align-items: center; gap: 3px; color: var(--accent-bright); text-decoration: none; white-space: nowrap; }
        .mk-logo-links a:hover, .mk-logo-links a:focus-visible { text-decoration: underline; }
        .mk-grid--logos { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px 14px; }

        .mk-folder-line { font-size: var(--fs-body-s); color: var(--ink-mute); margin: 22px 0 0; }
        .mk-folder-line a { color: var(--accent-bright); text-decoration: none; }
        .mk-folder-line a:hover { text-decoration: underline; }

        /* Team: a card per person. The lead card spans the row, its photo
           beside the name, role, and bio; the others sit two to a row. */
        .mk-people { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .mk-person {
            display: grid;
            grid-template-columns: 132px minmax(0, 1fr);
            gap: 20px;
            align-items: center;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }
        .mk-person--lead {
            grid-column: 1 / -1;
            grid-template-columns: 240px minmax(0, 1fr);
            gap: 32px;
            align-items: start;
            padding: 24px;
            background: var(--bg-soft);
            border-color: transparent;
        }
        .mk-person-photo { border-radius: 16px; }
        .mk-person h3 { font-family: var(--font-display); font-size: var(--fs-h3); font-weight: 600; margin: 0 0 2px; }
        .mk-person--lead h3 { font-size: var(--fs-h3-lg); font-weight: 500; letter-spacing: var(--ls-title); margin-top: 4px; }
        .mk-role { font-size: var(--fs-body-s); color: var(--ink-mute); margin: 0 0 12px; }
        .mk-role:last-child { margin-bottom: 0; }
        .mk-bio { font-size: var(--fs-body); color: var(--ink-soft); line-height: var(--line-height-base); max-width: 680px; margin: 0 0 16px; }
        .mk-person-links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; }
        .mk-person-links a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: var(--fs-body-s);
            font-weight: 600;
            color: var(--accent-bright);
            text-decoration: none;
        }
        .mk-person-links a:hover, .mk-person-links a:focus-visible { text-decoration: underline; }

        /* Product brief + specs, side by side */
        .mk-product {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 32px 56px;
            align-items: start;
        }
        .mk-brief--lead { font-size: var(--fs-lead); color: var(--ink); }
        .mk-brief {
            font-size: var(--fs-body);
            color: var(--ink-soft);
            line-height: var(--line-height-base);
            max-width: var(--container-narrow);
            margin: 0 0 14px;
        }
        .mk-uses {
            max-width: var(--container-narrow);
            margin: -2px 0 14px;
            padding: 0 0 0 20px;
            font-size: var(--fs-body);
            color: var(--ink-soft);
            line-height: var(--line-height-base);
        }
        .mk-uses li { margin: 0 0 10px; }
        .mk-uses li:last-child { margin-bottom: 0; }
        .mk-uses b { font-weight: 600; color: var(--ink); }
        .mk-spec-table-wrap {
            max-width: var(--container-narrow);
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--bg-card);
            overflow: hidden;
            margin: 0;
        }
        .mk-spec-table { width: 100%; border-collapse: collapse; }
        .mk-spec-table th, .mk-spec-table td {
            padding: 13px 18px 14px;
            text-align: left;
            vertical-align: top;
        }
        .mk-spec-table tr + tr th, .mk-spec-table tr + tr td { border-top: 1px solid var(--line); }
        .mk-spec-table th {
            width: 118px;
            padding-top: 16px;
            font-size: var(--fs-micro);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-mute);
            white-space: nowrap;
        }
        .mk-spec-table td { font-size: var(--fs-body-s); font-weight: 600; color: var(--ink); }
        .mk-spec-table td span {
            display: block;
            font-size: var(--fs-caption);
            font-weight: 400;
            color: var(--ink-mute);
            margin-top: 3px;
        }
        .mk-spec-table .mk-spec-group th {
            width: auto;
            padding: 15px 18px 13px;
            font-size: var(--fs-body-s);
            font-weight: 600;
            letter-spacing: 0;
            text-transform: none;
            color: var(--ink);
            background: var(--bg);
            white-space: normal;
        }
        .mk-price-line { font-size: var(--fs-body); color: var(--ink-mute); margin: 22px 0 0; }
        .mk-price-line strong { color: var(--ink); font-weight: 600; }

        /* Demo videos: one card per demo setting — the text, then a row of
           small rounded poster tiles of one shared height: the 16:9 full film
           and the 9:16 reel. A tile opens the film in the
           page's lightbox as a <video> (AV1 first, H.264 fallback). */
        .mk-demos { display: grid; gap: 14px; --stage-h: 200px; }
        .mk-demo {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 20px 28px;
            align-items: center;
            padding: 22px 24px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--bg-card);
        }
        .mk-demo-media { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
        .mk-demo-stage { position: relative; height: var(--stage-h); border-radius: 13px; overflow: hidden; background: var(--bg-dark); }
        .mk-demo-stage img { display: block; height: 100%; width: auto; aspect-ratio: 16 / 9; object-fit: cover; }
        .mk-demo-stage--reel img { aspect-ratio: 9 / 16; }
        .mk-demo-play {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            padding: 0;
            background: linear-gradient(to top, rgba(29, 29, 31, 0.7), rgba(29, 29, 31, 0) 46%);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .mk-demo-play::after {
            content: "";
            position: absolute;
            inset: 0;
            margin: auto;
            width: 54px;
            height: 54px;
            border-radius: 50%; corner-shape: round;
            background: rgba(29, 29, 31, 0.62)
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="white" d="M9 6.5v11l9-5.5z"/></svg>')
                center / 26px no-repeat;
            transition: background-color 0.2s var(--ease), transform 0.2s var(--ease);
        }
        .mk-demo-stage--reel .mk-demo-play::after { width: 44px; height: 44px; background-size: 22px; }
        .mk-demo-play:hover::after, .mk-demo-play:focus-visible::after { background-color: rgba(29, 29, 31, 0.84); transform: scale(1.06); }
        .mk-demo-cap {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 10px;
            color: #fff;
            font-size: var(--fs-caption);
            line-height: 1.3;
            text-align: left;
            pointer-events: none;
        }
        .mk-demo-cap b { display: block; font-weight: 600; }
        .mk-demo-cap span { opacity: 0.8; }
        .mk-demo-body { min-width: 0; }
        .mk-demo-body h3 { font-family: var(--font-display); font-size: var(--fs-h3); font-weight: 600; margin: 0 0 6px; }
        .mk-demo-body p { font-size: var(--fs-body-s); color: var(--ink-mute); margin: 0; }
        .mk-demo-tile { display: flex; flex-direction: column; gap: 8px; }
        /* width: 0 + min-width: 100% lets the poster, not the link text, set the tile's width */
        .mk-demo-dl { width: 0; min-width: 100%; font-size: var(--fs-caption); font-weight: 600; color: var(--accent-bright); text-decoration: none; line-height: 1.3; }
        .mk-demo-dl:hover { text-decoration: underline; }
        @media (max-width: 1040px) {
            .mk-demos { --stage-h: 170px; }
        }
        /* Films: two cards side by side, each poster the card's full width */
        .mk-films { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 24px; }
        .mk-film-stage { height: auto; border-radius: 16px; }
        .mk-film-stage img { width: 100%; height: auto; }
        .mk-film-stage .mk-demo-cap { left: 16px; bottom: 14px; font-size: var(--fs-body-s); }
        .mk-film h3 { font-family: var(--font-display); font-size: var(--fs-h3); font-weight: 600; margin: 16px 0 6px; }
        .mk-film p { font-size: var(--fs-body-s); color: var(--ink-mute); margin: 0 0 10px; max-width: 520px; }
        .mk-film .mk-demo-dl { width: auto; min-width: 0; }
        /* Launch event (Oct 16, 2026): the facts in a row, the three films
           in one row (five, until the walkthrough with the CEO and, for
           now, the behind-the-scenes cut came out on Oct 20, 2026), then
           the links. */
        .mk-event-facts { display: flex; flex-wrap: wrap; gap: 12px 36px; margin: 0 0 28px; padding: 0; list-style: none; font-size: var(--fs-body-s); }
        .mk-event-facts b { display: block; margin-bottom: 2px; font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-mute); }
        .mk-films--event { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 20px; }
        .mk-films--event .mk-film h3 { font-size: var(--fs-lead); margin-top: 12px; }
        .mk-event-tour { margin: 0 0 32px; }
        .mk-event-tour-icon { color: var(--accent-bright); }
        .mk-event-links { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 28px 0 0; padding: 0; list-style: none; font-size: var(--fs-body-s); }
        .mk-event-links a { color: var(--accent-bright); font-weight: 600; text-decoration: none; }
        .mk-event-links a:hover { text-decoration: underline; }
        .mk-event-facts a { color: var(--accent-bright); text-decoration: none; }
        .mk-event-facts a:hover { text-decoration: underline; }
        /* News: dated rows on hairlines, the date in a left column */
        /* Coverage: the outlet, the story's own headline, byline and date */
        .mk-press-head { font-size: var(--fs-h3); font-weight: 600; margin: 36px 0 10px; }
        .mk-press-head:first-of-type { margin-top: 0; }
        .mk-press { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
        .mk-press li { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 4px 32px; padding: 14px 0; border-bottom: 1px solid var(--line); }
        .mk-press-outlet { font-size: var(--fs-body-s); font-weight: 600; color: var(--ink); padding-top: 2px; }
        .mk-press-outlet img { display: block; width: 140px; height: 36px; max-width: 100%; object-fit: contain; object-position: left center; }
        .mk-press-outlet--pcmag img { width: 40px; height: 40px; }
        .mk-press-outlet { align-self: center; }
        .mk-press a { font-size: var(--fs-body); color: var(--ink); text-decoration: none; }
        .mk-press a::after { content: " \2197"; color: var(--ink-mute); font-size: var(--fs-body-s); }
        .mk-press a:hover, .mk-press a:focus-visible { color: var(--accent-bright); text-decoration: underline; }
        .mk-press-meta { display: block; font-size: var(--fs-caption); color: var(--ink-mute); margin-top: 3px; }
        .mk-about { max-width: 720px; }
        .mk-about .mk-event-facts { margin: 24px 0 0; }
        /* The ad creatives as a picture cloud: a dense 12-column grid whose
           tiles take three sizes by their place in the run, each tilted a
           little its own way and lapping its neighbours, the name a chip
           that rises under the pointer; a tile lifts, straightens and comes
           to the front on hover. The row unit is a column's width, in
           container query units, so the cloud keeps its shape at any width. */
        .mk-cloud-wrap { container-type: inline-size; }
        .mk-cloud {
            --mk-cloud-gap: 10px;
            display: grid;
            grid-template-columns: repeat(14, minmax(0, 1fr));
            grid-auto-rows: calc((100cqw - 13 * var(--mk-cloud-gap)) / 14);
            grid-auto-flow: dense;
            gap: var(--mk-cloud-gap);
            padding: 12px 0 20px;
        }
        .mk-cloud-tile {
            position: relative;
            grid-column: span 2; grid-row: span 2;
            border: 0;
            border-radius: 18px;
            box-shadow: 0 1px 2px rgba(var(--ink-rgb), 0.08), 0 8px 24px -12px rgba(var(--ink-rgb), 0.35);
            overflow: hidden;
            transform: rotate(var(--mk-tilt, 0deg)) translate(var(--mk-dx, 0), var(--mk-dy, 0));
            transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), z-index 0s 0.35s;
        }
        .mk-cloud-tile img { width: 100%; height: 100%; aspect-ratio: auto; object-fit: cover; background: var(--bg-soft); }
        .mk-cloud-tile:nth-child(1), .mk-cloud-tile:nth-child(10) { grid-column: span 4; grid-row: span 4; }
        .mk-cloud-tile:nth-child(2), .mk-cloud-tile:nth-child(7), .mk-cloud-tile:nth-child(11), .mk-cloud-tile:nth-child(14) { grid-column: span 3; grid-row: span 3; }
        .mk-cloud-tile:nth-child(4n+1) { --mk-tilt: -2.4deg; --mk-dy: 6px; }
        .mk-cloud-tile:nth-child(4n+2) { --mk-tilt: 1.6deg; --mk-dx: -5px; }
        .mk-cloud-tile:nth-child(4n+3) { --mk-tilt: 2.8deg; --mk-dy: -5px; }
        .mk-cloud-tile:nth-child(4n+4) { --mk-tilt: -1.4deg; --mk-dx: 6px; }
        .mk-cloud-tile:nth-child(7n+3) { --mk-tilt: -3.2deg; }
        .mk-cloud-tile:nth-child(9n+5) { --mk-tilt: 3.4deg; --mk-dy: 8px; }
        .mk-cloud-tile:hover, .mk-cloud-tile:focus-visible {
            z-index: 3;
            transform: rotate(0deg) scale(1.08);
            box-shadow: 0 2px 4px rgba(var(--ink-rgb), 0.1), 0 24px 48px -16px rgba(var(--ink-rgb), 0.45);
            transition-delay: 0s;
        }
        .mk-cloud-name {
            position: absolute; left: 10px; bottom: 10px;
            padding: 4px 10px;
            border-radius: 999px; corner-shape: round;
            background: rgba(var(--bg-rgb), 0.9);
            color: var(--ink);
            font-size: var(--fs-caption);
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
            pointer-events: none;
        }
        .mk-cloud-tile:hover .mk-cloud-name, .mk-cloud-tile:focus-visible .mk-cloud-name { opacity: 1; transform: none; }
        @media (hover: none) { .mk-cloud-name { opacity: 1; transform: none; } }
        @media (max-width: 720px) {
            .mk-cloud { --mk-cloud-gap: 8px; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: calc((100cqw - 6 * var(--mk-cloud-gap)) / 7); }
            .mk-cloud-tile { border-radius: 12px; }
            .mk-cloud-name { font-size: 11px; padding: 3px 8px; left: 6px; bottom: 6px; }
        }
        @media (prefers-reduced-motion: reduce) { .mk-cloud-tile, .mk-cloud-name { transition: none; } }
        @media (max-width: 720px) {
            .mk-press li { grid-template-columns: 1fr; gap: 4px; }
        }
        @media (max-width: 1040px) {
            .mk-films--event { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        .mk-drive {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-top: 22px;
            padding: 14px 20px 14px 16px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--bg-card);
            color: var(--ink);
            text-decoration: none;
            transition: border-color 0.2s var(--ease), transform 0.2s var(--ease);
        }
        .mk-drive:hover, .mk-drive:focus-visible { border-color: var(--line-strong); transform: translateY(-1px); }
        .mk-drive-icon { width: 28px; height: 25px; flex: 0 0 auto; }
        .mk-drive-text { display: block; min-width: 0; }
        .mk-drive-text b { display: block; font-size: var(--fs-body-s); font-weight: 600; color: var(--accent-bright); }
        .mk-drive-text span { display: block; font-size: var(--fs-caption); color: var(--ink-mute); margin-top: 2px; }

        /* Lightbox (buttons only — no links) */
        .mk-lb {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(29, 29, 31, 0.82);
            padding: 30px;
            overscroll-behavior: contain;
        }
        .mk-lb.is-open { display: flex; }
        .mk-lb figure { margin: 0; max-width: min(1100px, 94vw); text-align: center; }
        .mk-lb img {
            max-width: min(1100px, 94vw);
            max-height: 82vh;
            max-height: 82dvh;
            border-radius: 13px;
            background: #fff;
            display: block;
            margin: 0 auto;
        }
        .mk-lb video {
            max-width: min(1100px, 94vw);
            max-height: 82vh;
            max-height: 82dvh;
            border-radius: 13px;
            background: #000;
            display: block;
            margin: 0 auto;
        }
        /* The turntable loop is rendered on white, so its slot is white too */
        .mk-lb video.is-loop { background: #fff; }
        /* display: block above beats the UA [hidden] rule, so restate it */
        .mk-lb img[hidden], .mk-lb video[hidden] { display: none; }
        .mk-lb figcaption { color: rgba(255, 255, 255, 0.85); font-size: var(--fs-body-s); margin-top: 12px; }
        .mk-lb button {
            position: absolute;
            border: 0;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
