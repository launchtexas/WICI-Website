    <style>
      .article-note {
        color: var(--muted);
        font-size: 16px;
        font-weight: 680;
      }

      code {
        padding: .12em .32em;
        border: 1px solid var(--line-soft);
        border-radius: 5px;
        background: #fafafa;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: .88em;
      }

      .claim {
        margin: 34px 0;
        padding: 22px 24px;
        border-left: 5px solid var(--accent);
        background: #fff;
        font-size: 23px;
        line-height: 1.28;
        font-weight: 820;
        box-shadow: var(--shadow);
      }

      .figure {
        margin: 38px 0 42px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .figure h3 {
        margin: 0 0 6px;
        font-size: 18px;
        line-height: 1.25;
      }

      .figure p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.45;
      }

      .video-embed {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 10px;
        background: #000;
      }

      .video-embed video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      .model-bars {
        display: grid;
        gap: 13px;
      }

      .curve-chart {
        width: 100%;
        min-height: 430px;
      }

      .curve-chart svg {
        display: block;
        width: 100%;
        height: auto;
        min-height: 430px;
      }

      .curve-axis {
        stroke: #b9c0ca;
        stroke-width: 1;
      }

      .curve-grid {
        stroke: #e6e9ee;
        stroke-width: 1;
      }

      .curve-label,
      .curve-tick {
        fill: var(--muted);
        font-size: 13px;
      }

      .curve-title-label {
        fill: var(--ink);
        font-size: 13px;
        font-weight: 780;
      }

      .curve-line {
        fill: none;
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .curve-line--human {
        stroke-dasharray: 12 10;
        stroke-width: 4;
      }

      .curve-legend text {
        fill: var(--ink-soft);
        font-size: 13px;
      }

      .curve-note {
        margin: 12px 0 0 !important;
        color: var(--muted);
        font-size: 13px !important;
        line-height: 1.4 !important;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 184px minmax(130px, 1fr) 88px 88px;
        gap: 12px;
        align-items: center;
        min-height: 38px;
        font-size: 13px;
      }

      .bar-label {
        color: var(--ink);
        font-weight: 760;
        line-height: 1.25;
      }

      .bar-track {
        position: relative;
        height: 15px;
        overflow: hidden;
        border-radius: 999px; corner-shape: round;
        background: #eef1f5;
      }

      .bar-fill {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), #59a8ff);
      }

      .bar-fill.secondary {
        background: linear-gradient(90deg, var(--accent-3), #49b985);
      }

      .bar-value,
      .bar-c {
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }

      .bar-value {
        font-weight: 780;
        text-align: right;
      }

      .bar-c {
        color: var(--muted);
        text-align: right;
      }

      .bar-head {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .06em;
      }

      .step-stack {
        display: grid;
        gap: 12px;
      }

      .step {
        display: grid;
        grid-template-columns: 210px minmax(130px, 1fr) 74px;
        gap: 12px;
        align-items: center;
        min-height: 44px;
      }

      .step-name {
        color: var(--ink);
        font-size: 14px;
        font-weight: 760;
        line-height: 1.25;
      }

      .step-note {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 520;
      }

      .step-fill {
        display: block;
        height: 18px;
        border-radius: 999px; corner-shape: round;
        background: linear-gradient(90deg, var(--accent), #59a8ff);
      }

      .step-fill.warn {
        background: linear-gradient(90deg, var(--accent-2), #f0a15f);
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .metric {
        min-height: 114px;
        padding: 16px;
        border: 1px solid #dfe5ec;
        border-radius: 13px;
        background: #fff;
      }

      .metric b {
        display: block;
        color: var(--ink);
        font-size: 30px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .metric span {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .gate-matrix {
        display: grid;
        grid-template-columns: 172px 1fr;
        gap: 10px;
      }

      .gate-head,
      .gate-cell {
        min-width: 0;
        padding: 14px;
        border: 1px solid #dfe5ec;
        border-radius: 13px;
        background: #fff;
        font-size: 13px;
        line-height: 1.35;
      }

      .gate-head {
        color: #fff;
        background: var(--dark);
        font-weight: 820;
      }

      .gate-cell b {
        display: block;
        margin-bottom: 4px;
        font-size: 15px;
        color: var(--ink);
      }

      .gate-cell span {
        color: var(--muted);
      }

      .sources {
        margin-top: 52px;
        padding-top: 26px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }

      .sources h2 {
        margin: 0 0 14px;
        font-size: 22px;
        color: var(--ink);
      }

      .sources ul {
        margin: 0;
        padding-left: 20px;
      }

      .sources li {
        font-size: 14px;
        color: var(--muted);
      }

      .sources li + li {
        margin-top: 8px;
      }

      .footer li + li { margin-top: 7px; }

      @media (max-width: 720px) {

        .article-tldr,
        .figure {
          padding: 18px;
        }

        .claim {
          padding: 18px;
          font-size: 20px;
        }

        .bar-row,
        .step {
          grid-template-columns: 1fr;
          gap: 6px;
        }

        .bar-value,
        .bar-c {
          text-align: left;
        }

        .metric-grid {
          grid-template-columns: 1fr;
        }

        .gate-matrix {
          grid-template-columns: 1fr;
        }

      }
    </style>
