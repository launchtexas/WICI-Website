    <script>
      (function () {
        var mount = document.getElementById("answerabilityCurve");
        var source = document.getElementById("answerabilityCsv");
        if (!mount || !source) return;

        var rows = source.textContent.trim().split(/\n+/).map(function (line) {
          return line.split(",");
        });
        var header = rows.shift();
        var data = rows.map(function (parts) {
          var row = {};
          header.forEach(function (key, index) {
            row[key] = Number(parts[index]);
          });
          return row;
        });

        var series = [
          { key: "gemini35_flash", label: "Gemini 3.5 Flash", color: "#686bc0", wide: true },
          { key: "qwen36_27b", label: "Qwen3.6 27B", color: "#12805c" },
          { key: "gemma4_31b", label: "Gemma 4 31B", color: "#8b6fcb" },
          { key: "qwen35_9b", label: "Qwen3.5 9B", color: "#d85f36" },
          { key: "qwen35_4b", label: "Qwen3.5 4B", color: "#8a8f98" },
          { key: "human_havg_ref_scaled", label: "Human avg buzz ref", color: "#252525", human: true }
        ];

        function draw() {
          var width = 900;
          var height = 470;
          var margin = { left: 62, right: 170, top: 24, bottom: 58 };
          var plotW = width - margin.left - margin.right;
          var plotH = height - margin.top - margin.bottom;
          var x = function (c) { return margin.left + c * plotW; };
          var y = function (v) { return margin.top + (1 - v / 1024) * plotH; };
          var esc = function (s) {
            return String(s).replace(/[&<>"']/g, function (ch) {
              return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
            });
          };
          var pathFor = function (key) {
            return data.map(function (row, index) {
              return (index ? "L" : "M") + x(row.c).toFixed(1) + " " + y(row[key]).toFixed(1);
            }).join(" ");
          };
          var parts = [];
          parts.push('<svg viewBox="0 0 ' + width + ' ' + height + '" aria-hidden="true">');
          [0, 256, 512, 768, 1024].forEach(function (tick) {
            parts.push('<line class="curve-grid" x1="' + margin.left + '" y1="' + y(tick) + '" x2="' + (width - margin.right) + '" y2="' + y(tick) + '"></line>');
            parts.push('<text class="curve-tick" x="' + (margin.left - 12) + '" y="' + (y(tick) + 4) + '" text-anchor="end">' + tick + '</text>');
          });
          [0, .2, .4, .6, .8, 1].forEach(function (tick) {
            parts.push('<line class="curve-grid" x1="' + x(tick) + '" y1="' + margin.top + '" x2="' + x(tick) + '" y2="' + (height - margin.bottom) + '"></line>');
            parts.push('<text class="curve-tick" x="' + x(tick) + '" y="' + (height - 25) + '" text-anchor="middle">' + Math.round(tick * 100) + '%</text>');
          });
          parts.push('<line class="curve-axis" x1="' + margin.left + '" y1="' + (height - margin.bottom) + '" x2="' + (width - margin.right) + '" y2="' + (height - margin.bottom) + '"></line>');
          parts.push('<line class="curve-axis" x1="' + margin.left + '" y1="' + margin.top + '" x2="' + margin.left + '" y2="' + (height - margin.bottom) + '"></line>');
          parts.push('<text class="curve-label" x="' + (margin.left + plotW / 2) + '" y="' + (height - 5) + '" text-anchor="middle">Question position c</text>');
          parts.push('<text class="curve-label" transform="translate(18 ' + (margin.top + plotH / 2) + ') rotate(-90)" text-anchor="middle">Cumulative correct questions</text>');
          parts.push('<line x1="' + x(0.634) + '" y1="' + margin.top + '" x2="' + x(0.634) + '" y2="' + (height - margin.bottom) + '" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="4 5"></line>');
          parts.push('<text class="curve-label" x="' + (x(0.634) + 8) + '" y="' + (margin.top + 26) + '">human median c=0.634</text>');
          series.forEach(function (s) {
            var cls = "curve-line" + (s.human ? " curve-line--human" : "");
            var strokeWidth = s.wide ? 4 : 3.2;
            parts.push('<path class="' + cls + '" d="' + pathFor(s.key) + '" stroke="' + s.color + '" stroke-width="' + strokeWidth + '"></path>');
          });
          parts.push('<g class="curve-legend" transform="translate(' + (width - margin.right + 22) + ' ' + (margin.top + 10) + ')">');
          series.forEach(function (s, index) {
            var y0 = index * 27;
            var dash = s.human ? ' stroke-dasharray="8 6"' : "";
            parts.push('<line x1="0" y1="' + y0 + '" x2="28" y2="' + y0 + '" stroke="' + s.color + '" stroke-width="4"' + dash + '></line>');
            parts.push('<text x="38" y="' + (y0 + 4) + '">' + esc(s.label) + '</text>');
          });
          parts.push('</g>');
          parts.push('</svg>');
          mount.innerHTML = parts.join("");
        }

        draw();
      })();
