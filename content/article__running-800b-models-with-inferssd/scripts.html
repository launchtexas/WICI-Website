    <script>
        /* The WiCi Infer bar: closed for the browser session by its button, away while the footer is in view. */
        (function () {
            var bar = document.getElementById('infApp');
            if (!bar) return;
            var KEY = 'wici-inf-app-closed';
            try { if (sessionStorage.getItem(KEY)) { bar.remove(); return; } } catch (e) {}
            bar.querySelector('.inf-app-close').addEventListener('click', function () {
                try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
                bar.remove();
            });
            var footer = document.querySelector('.footer');
            if (footer && 'IntersectionObserver' in window) {
                new IntersectionObserver(function (entries) {
                    bar.classList.toggle('is-away', entries[0].isIntersecting);
                }).observe(footer);
            }
        }());
    </script>
