    <script>document.documentElement.classList.add('infer-nav-scroll');
        /* A campaign arrival (any utm_* on the URL: the emails, the ads) that names #get-started starts at the top of the page instead: the anchor is dropped here, before the browser or js/common.js scrolls to it. The page's own Download links and links without utm_* still jump there. */
        try { if (window.location.hash === '#get-started' && /[?&]utm_[a-z]+=/.test(window.location.search)) window.history.replaceState(window.history.state, '', window.location.pathname + window.location.search); } catch (error) { /* the anchor stays */ }
        /* Phones and tablets cannot install a desktop app: there the download buttons open a dialog with "email me the link" (js/infer.js). */
        if (/Android|iPhone|iPod|iPad/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) document.documentElement.classList.add('infer-mobile');
        /* The download buttons name the visitor's system (macos or windows); on anything else they read "Download" and open the menu (css/infer.css, js/infer.js). */
        document.documentElement.dataset.inferOs = document.documentElement.classList.contains('infer-mobile') ? 'unknown' : /Windows/i.test(navigator.userAgent) ? 'windows' : /Macintosh|Mac OS X/i.test(navigator.userAgent) ? 'macos' : 'unknown';</script>

    <style id="download-engine-styles">
        /* The Linux row in the download menus links to the engine on GitHub. */
        .infer-download-menu a.infer-download-engine { background: none; }
        .infer-download-menu a.infer-download-engine:hover { background: rgba(var(--ink-rgb), .04); color: var(--ink); }
        .infer-download-engine small { color: var(--ink-mute); font-size: var(--fs-caption); }
        .infer-download-engine > span[aria-hidden] { color: var(--ink-mute); }
        /* Platform marks: monochrome, level with the first line of each row. */
        .infer-download-menu .infer-os-mark { flex: none; width: 18px; height: 18px; margin-right: -4px; align-self: flex-start; margin-top: calc((1lh - 18px) / 2); color: var(--ink); }
        .infer-download-menu .infer-os-mark + span { flex: 1; }
        .infer-download-menu { width: 380px; }
        .infer-download-menu button:disabled .infer-os-mark { color: var(--ink-mute); }
        .infer-download-engine small { flex-shrink: 1; text-align: right; }
        .infer-download-engine > span[aria-hidden] { margin-left: -6px; }
    </style>
    <style id="supported-models-styles">
        /* Keep the model catalogue isolated from concurrent section work. */
        #supported-models { padding-block: 64px 0; background: var(--bg); color: var(--ink); }
        #supported-models > .ssd-wrap { max-width: 1080px; padding-inline: 28px; }
        #supported-models .im-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
        #supported-models h2 { font-family: var(--font-display); font-size: var(--fs-lead); line-height: var(--lh-title); letter-spacing: var(--ls-title); font-weight: 500; color: var(--ink); }
        #supported-models .im-heading p { font-size: var(--fs-body-s); line-height: var(--lh-body); color: var(--ink-mute); }
        #supported-models .im-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 32px 24px; }
        #supported-models .im-card { min-width: 0; }
        #supported-models .im-model { display: flex; align-items: center; gap: 10px; min-height: 36px; }
        #supported-models .im-logo { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; }
        #supported-models h3 { font-family: var(--font-display); font-size: var(--fs-body); font-weight: 600; line-height: var(--lh-title); letter-spacing: var(--ls-title); color: var(--ink); }
        #supported-models .im-parameters { margin-top: 4px; font-size: var(--fs-micro); line-height: var(--lh-body); color: var(--ink-mute); }
        #supported-models .im-use { margin-top: 12px; font-size: var(--fs-caption); line-height: var(--lh-body); color: var(--ink-soft); }
        #supported-models .im-specs { display: grid; gap: 4px; margin: 12px 0 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg-soft); }
        #supported-models .im-specs > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 16px; }
        #supported-models .im-specs dt { font-size: var(--fs-micro); line-height: var(--lh-body); color: var(--ink-mute); }
        #supported-models .im-specs dd { margin: 0; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: var(--fs-caption); font-weight: 500; line-height: var(--lh-body); color: var(--ink); }
        #supported-models .im-computer { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 6px; font-size: var(--fs-micro); line-height: var(--lh-body); color: var(--ink-soft); }
        #supported-models .im-computer span { color: var(--ink-mute); }
        @media (max-width: 720px) {
            #supported-models { padding-block: 48px 0; }
            #supported-models > .ssd-wrap { padding-inline: 20px; }
            #supported-models .im-heading { align-items: flex-start; margin-bottom: 24px; }
        }
    </style>
    <style id="infer-faq-styles">

        .infer-faq { padding-block: 64px 32px; background: var(--bg); color: var(--ink); }
        .infer-faq > .ssd-wrap { max-width: 1080px; padding-inline: 28px; }
        .infer-faq h2 { margin-bottom: 24px; font-family: var(--font-display); font-size: var(--fs-lead); line-height: var(--lh-title); letter-spacing: var(--ls-title); font-weight: 500; color: var(--ink); }
        .infer-faq-list { border-top: 1px solid var(--line); }
        .infer-faq-item { border-bottom: 1px solid var(--line); }
        .infer-faq-item summary { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px 0; cursor: pointer; list-style: none; }
        .infer-faq-item summary::-webkit-details-marker { display: none; }
        .infer-faq-item summary::after { content: ''; flex: none; width: 7px; height: 7px; margin-right: 4px; border-right: 1.5px solid var(--ink-mute); border-bottom: 1.5px solid var(--ink-mute); transform: translateY(-2px) rotate(45deg); transition: transform .2s var(--ease); }
        .infer-faq-item[open] summary::after { transform: translateY(2px) rotate(-135deg); }
        .infer-faq-item h3 { font-family: var(--font-sans); font-size: var(--fs-body); font-weight: 500; line-height: var(--lh-body); color: var(--ink); }
        .infer-faq-item summary:hover h3 { color: var(--accent-bright); }
        .infer-faq-item p { max-width: 72ch; padding-bottom: 20px; font-size: var(--fs-body-s); line-height: var(--lh-body); color: var(--ink-soft); }
        @media (max-width: 720px) {
            .infer-faq { padding-block: 48px 24px; }
            .infer-faq > .ssd-wrap { padding-inline: 20px; }
        }
        @media (prefers-reduced-motion: reduce) { .infer-faq-item summary::after { transition: none; } }
    </style>
    <style id="infer-mobile-nav-fix">
        /* The open drawer must override the page-specific sticky #nav rule. */
        #nav.is-menu-open { position: fixed; top: 0; left: 0; right: 0; }
        /* Over the hero photo the header is light glass, lightest at the top of the page. */
        #nav::before { transition: opacity .3s var(--ease), background-color .4s var(--ease); }
        html.infer-nav-scroll #nav:not(.is-past-hero):not(.is-menu-open)::before { background: rgba(var(--ink-rgb), .12); backdrop-filter: blur(10px) brightness(.72); -webkit-backdrop-filter: blur(10px) brightness(.72); }
        html.infer-nav-scroll #nav:not(.is-past-hero):not(.is-scrolled):not(.is-menu-open)::before { background: rgba(var(--ink-rgb), 0); backdrop-filter: blur(10px) brightness(.86); -webkit-backdrop-filter: blur(10px) brightness(.86); }
        @media (max-width: 720px) {
            #nav { --infer-nav-surface: rgb(var(--ink-rgb)); transition: opacity .18s ease, transform .28s var(--ease), visibility 0s, background-color .4s var(--ease); }
            #nav::before { background: rgba(var(--ink-rgb), .72); transition: opacity .3s var(--ease), background-color .4s var(--ease); }
            #nav.is-menu-open, #nav.is-menu-open::before { background: var(--infer-nav-surface); }
            #nav.is-menu-open::before { backdrop-filter: none; -webkit-backdrop-filter: none; }
            #nav .nav-mobile { background: var(--infer-nav-surface); transition: opacity .4s var(--ease), transform .4s var(--ease), visibility 0s linear .4s; }
            #nav .nav-mobile.is-open { transition: opacity .4s var(--ease), transform .4s var(--ease); }
        }
        @media (prefers-reduced-motion: reduce) {
            #nav, #nav::before, #nav .nav-mobile, #nav .nav-mobile.is-open { transition: none; }
        }
    </style>
