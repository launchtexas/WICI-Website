    <script src="/js/articles.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script>
        // Figure 1 — two separate populations, each fit and extrapolated on
        // its own: closed frontier flagships racing for raw scale, and
        // open-weight models racing for deployability instead. Mixing them
        // into one regression flattens the slope and understates both.
        (function () {
            var plot = document.getElementById("param-trend-plot");
            var fallback = document.getElementById("param-trend-fallback");
            if (!plot) return;

            function showFallback() {
                plot.style.display = "none";
                if (fallback) fallback.style.display = "block";
            }

            if (!window.Plotly) {
                showFallback();
                return;
            }

            // [year (decimal), parameters in billions, label]
            var frontier = [
                [2020.41, 175, "GPT-3"],
                [2023.20, 1800, "GPT-4 (leaked est.)"],
                [2025.12, 3000, "Grok 3 (est.)"],
                [2025.16, 6000, "GPT-4.5 (est.)"],
                [2026.25, 10000, "Mythos (leaked est.)"]
            ];
            var openWeight = [
                [2024.56, 405, "Llama 3.1 405B"],
                [2024.98, 671, "DeepSeek-V3"],
                [2025.53, 1000, "Kimi K2"],
                [2026.31, 1600, "DeepSeek-V4-Pro"],
                [2026.45, 753, "GLM-5.2"]
            ];

            // Least-squares fit of log10(params) = a + b * year.
            function fit(points) {
                var n = points.length, sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
                points.forEach(function (p) {
                    var x = p[0], y = Math.log10(p[1]);
                    sumX += x; sumY += y; sumXY += x * y; sumXX += x * x;
                });
                var b = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
                var a = (sumY - b * sumX) / n;
                return { a: a, b: b, at: function (year) { return Math.pow(10, a + b * year); } };
            }

            var frontierFit = fit(frontier);
            var openFit = fit(openWeight);
            var trendX = [2020, 2028];

            function formatParams(billions) {
                return billions >= 1000
                    ? (billions / 1000).toFixed(billions % 1000 === 0 ? 0 : 1) + "T"
                    : billions.toFixed(0) + "B";
            }

            function markerTrace(points, color) {
                return {
                    x: points.map(function (p) { return p[0]; }),
                    y: points.map(function (p) { return p[1]; }),
                    text: points.map(function (p) { return p[2]; }),
                    customdata: points.map(function (p) { return formatParams(p[1]); }),
                    mode: "markers+text",
                    type: "scatter",
                    textposition: "top center",
                    marker: { size: 12, color: color, line: { color: "#ffffff", width: 1.5 } },
                    hovertemplate: "<b>%{text}</b><br>%{x:.0f}: %{customdata} params<extra></extra>"
                };
            }

            function trendTrace(fitted, color, label) {
                var y = trendX.map(fitted.at);
                return {
                    x: trendX,
                    y: y,
                    customdata: y.map(formatParams),
                    mode: "lines",
                    type: "scatter",
                    line: { color: color, width: 2, dash: "dot" },
                    hovertemplate: label + "<br>%{x:.0f}: %{customdata} params<extra></extra>"
                };
            }

            var traces = [
                trendTrace(frontierFit, "#d85f36", "Closed frontier trend"),
                trendTrace(openFit, "#686bc0", "Open-weight trend"),
                markerTrace(frontier, "#d85f36"),
                markerTrace(openWeight, "#686bc0")
            ];

            var layout = {
                margin: { l: 72, r: 24, t: 24, b: 54 },
                paper_bgcolor: "#ffffff",
                plot_bgcolor: "#ffffff",
                font: {
                    family: "Google Sans Flex, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif",
                    color: "#1d1d1f"
                },
                xaxis: {
                    title: { text: "Year" },
                    range: [2019.5, 2028.5],
                    dtick: 1,
                    gridcolor: "#e5eaf1",
                    zeroline: false
                },
                yaxis: {
                    title: { text: "Parameters" },
                    type: "log",
                    range: [Math.log10(100), Math.log10(50000)],
                    tickvals: [100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000],
                    ticktext: ["100B", "200B", "500B", "1T", "2T", "5T", "10T", "20T", "50T"],
                    gridcolor: "#e5eaf1",
                    zeroline: false
                },
                showlegend: false
            };

            var config = {
                responsive: true,
                displaylogo: false,
                modeBarButtonsToRemove: ["lasso2d", "select2d"]
            };

            Plotly.newPlot(plot, traces, layout, config).catch(showFallback);
        })();
    </script>
