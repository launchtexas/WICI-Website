    <style>
      .figure {
        margin: 38px 0 42px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #fff;
        box-shadow: 0 18px 48px rgba(var(--ink-rgb), .08);
      }

      .figure h3 {
        margin: 0 0 6px;
        font-size: 18px;
        line-height: 1.25;
        color: var(--ink);
      }

      .figure p {
        margin: 0 0 18px;
        color: var(--ink-mute);
        font-size: 15px;
        line-height: 1.45;
      }

      .install-bar {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 8px 0 18px;
        padding: 14px 16px 14px 20px;
        border-radius: 13px;
        background: #101820;
      }

      .install-bar code {
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        white-space: pre;
        color: #edf4f1;
        font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .install-copy {
        flex-shrink: 0;
        padding: 8px 16px;
        border: 1px solid rgba(255, 255, 255, .25);
        border-radius: 10px;
        background: transparent;
        color: #edf4f1;
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
      }

      .install-copy:hover {
        background: rgba(255, 255, 255, .1);
        border-color: rgba(255, 255, 255, .45);
      }

      .install-copy.is-copied {
        border-color: var(--accent);
        color: var(--accent-bright);
      }

      .install-cta {
        margin: 0 0 40px;
      }

      .rule-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .rule-card {
        min-height: 140px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #fff;
      }

      .rule-card b {
        display: block;
        margin-bottom: 8px;
        color: var(--accent-bright);
        font-size: 16px;
      }

      .rule-card span {
        display: block;
        color: var(--ink-mute);
        font-size: 13px;
        line-height: 1.4;
      }

      .artifact-stack {
        display: grid;
        gap: 12px;
      }

      .artifact-row {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 14px;
        align-items: stretch;
      }

      .artifact-name,
      .artifact-role {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #fff;
      }

      .artifact-name {
        display: grid;
        place-items: center;
        color: #fff;
        background: var(--bg-dark);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
        font-weight: 700;
      }

      .artifact-role b {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
        font-size: 15px;
      }

      .artifact-role span {
        display: block;
        color: var(--ink-mute);
        font-size: 13px;
        line-height: 1.4;
      }

      @media (max-width: 720px) {
        .rule-grid { grid-template-columns: 1fr; }
        .figure { padding: 18px; }
        .artifact-row { grid-template-columns: 1fr; }
      }
    </style>
